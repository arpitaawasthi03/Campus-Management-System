<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${student.id == 0 ? 'Enroll Student' : 'Edit Student'} + ' - Campus Management System'">Student Form</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav class="navbar">
    <a class="navbar-brand" th:href="@{/dashboard}">
        <span>🏛️</span> Campus Management System
    </a>
    <ul class="navbar-nav">
        <li><a th:href="@{/dashboard}">Dashboard</a></li>
        <li><a th:href="@{/students}" class="active">Students</a></li>
        <li><a th:href="@{/courses}">Courses</a></li>
        <li><a th:href="@{/departments}">Departments</a></li>
        <li><a th:href="@{/faculty}">Faculty</a></li>
    </ul>
</nav>

<div class="form-container">
    <h1 class="page-title" th:text="${student.id == 0 ? 'Enroll New Student' : 'Edit Student Information'}">Student Form</h1>
    <p class="page-subtitle" style="margin-bottom: 24px;">Please complete the student details below.</p>

    <form th:action="@{/save-student}" method="post">
        <input type="hidden" name="id" th:value="${student.id}">

        <div class="form-group">
            <label for="rollNumber">Roll / Student ID Number *</label>
            <input type="text" id="rollNumber" name="rollNumber" th:value="${student.rollNumber}" placeholder="e.g. STU-2026-001" required>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="firstName">First Name *</label>
                <input type="text" id="firstName" name="firstName" th:value="${student.firstName}" placeholder="First name" required>
            </div>
            <div class="form-group">
                <label for="lastName">Last Name</label>
                <input type="text" id="lastName" name="lastName" th:value="${student.lastName}" placeholder="Last name">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="email">Campus Email Address *</label>
                <input type="email" id="email" name="email" th:value="${student.email}" placeholder="student@campus.edu" required>
            </div>
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" th:value="${student.phone}" placeholder="+1 555-0100">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="department">Academic Department *</label>
                <input type="text" id="department" name="department" th:value="${student.department}" placeholder="e.g. Computer Science" required list="deptList">
                <datalist id="deptList">
                    <option th:each="dept : ${departments}" th:value="${dept.name}" th:text="${dept.name}"></option>
                </datalist>
            </div>
            <div class="form-group">
                <label for="semester">Semester (1-8) *</label>
                <input type="number" id="semester" name="semester" min="1" max="12" th:value="${student.semester}" required>
            </div>
        </div>

        <div class="form-group">
            <label for="gpa">Current Cumulative GPA (0.00 - 4.00) *</label>
            <input type="number" id="gpa" name="gpa" step="0.01" min="0" max="4.0" th:value="${student.gpa}" required>
        </div>

        <div class="form-actions">
            <a class="btn btn-secondary" th:href="@{/students}">Cancel</a>
            <button type="submit" class="btn btn-primary" th:text="${student.id == 0 ? 'Save Student' : 'Update Student'}">Save</button>
        </div>
    </form>
</div>

</body>
</html>
