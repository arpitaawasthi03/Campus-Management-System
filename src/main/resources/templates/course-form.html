<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${course.id == 0 ? 'Create Course' : 'Edit Course'} + ' - Campus Management System'">Course Form</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav class="navbar">
    <a class="navbar-brand" th:href="@{/dashboard}">
        <span>🏛️</span> Campus Management System
    </a>
    <ul class="navbar-nav">
        <li><a th:href="@{/dashboard}">Dashboard</a></li>
        <li><a th:href="@{/students}">Students</a></li>
        <li><a th:href="@{/courses}" class="active">Courses</a></li>
        <li><a th:href="@{/departments}">Departments</a></li>
        <li><a th:href="@{/faculty}">Faculty</a></li>
    </ul>
</nav>

<div class="form-container">
    <h1 class="page-title" th:text="${course.id == 0 ? 'Create New Course' : 'Edit Course Information'}">Course Form</h1>
    <p class="page-subtitle" style="margin-bottom: 24px;">Specify curriculum and course details.</p>

    <form th:action="@{/save-course}" method="post">
        <input type="hidden" name="id" th:value="${course.id}">

        <div class="form-row">
            <div class="form-group">
                <label for="courseCode">Course Code *</label>
                <input type="text" id="courseCode" name="courseCode" th:value="${course.courseCode}" placeholder="e.g. CS-201" required>
            </div>
            <div class="form-group">
                <label for="credits">Credits *</label>
                <input type="number" id="credits" name="credits" min="1" max="10" th:value="${course.credits}" required>
            </div>
        </div>

        <div class="form-group">
            <label for="courseName">Course Title / Name *</label>
            <input type="text" id="courseName" name="courseName" th:value="${course.courseName}" placeholder="e.g. Operating Systems" required>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="department">Offering Department *</label>
                <input type="text" id="department" name="department" th:value="${course.department}" placeholder="e.g. Computer Science" required list="deptList">
                <datalist id="deptList">
                    <option th:each="dept : ${departments}" th:value="${dept.name}" th:text="${dept.name}"></option>
                </datalist>
            </div>
            <div class="form-group">
                <label for="instructor">Lead Instructor</label>
                <input type="text" id="instructor" name="instructor" th:value="${course.instructor}" placeholder="e.g. Prof. Alan Turing">
            </div>
        </div>

        <div class="form-group">
            <label for="description">Course Syllabus / Description</label>
            <textarea id="description" name="description" rows="3" placeholder="Brief outline of syllabus..." th:text="${course.description}"></textarea>
        </div>

        <div class="form-actions">
            <a class="btn btn-secondary" th:href="@{/courses}">Cancel</a>
            <button type="submit" class="btn btn-primary" th:text="${course.id == 0 ? 'Save Course' : 'Update Course'}">Save</button>
        </div>
    </form>
</div>

</body>
</html>
